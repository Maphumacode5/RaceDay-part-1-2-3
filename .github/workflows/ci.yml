name: RaceDay CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build, Test and Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify repository structure
        run: |
          test -f RaceDay.sln
          test -f src/RaceDay.Api/RaceDay.Api.csproj
          test -f src/RaceDay.Mvc/RaceDay.Mvc.csproj
          test -f tests/RaceDay.Api.Tests/RaceDay.Api.Tests.csproj
          test -f tests/RaceDay.Mvc.Tests/RaceDay.Mvc.Tests.csproj
          test -f docker-compose.yml

      - name: Restore dependencies
        run: dotnet restore RaceDay.sln

      - name: Build solution
        run: dotnet build RaceDay.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test RaceDay.sln --configuration Release --no-build --verbosity normal

      - name: Build Docker images
        run: docker compose build
